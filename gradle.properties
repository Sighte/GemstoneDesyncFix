# Gradle
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Loom snapshot is not configuration-cache compatible yet.
org.gradle.configuration-cache=false

# Minecraft / Fabric — target the modpack's version (Minecraft 26.1.2, Java 25).
# Recipe mirrors current 26.x Fabric mods (e.g. Skyblocker): Loom 1.17, no explicit
# yarn/mojmap mappings line — modern Loom supplies the default mapping for 26.x.
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod
mod_version=1.0.0
maven_group=com.gdfix
archives_base_name=gemstone-desync-fix

# Dependencies
fabric_version=0.155.2+26.1.2
